<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- SETUP SCENE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- PLANET TENGAH ---
    const geometry = new THREE.SphereGeometry(1.5, 64, 64);
    const material = new THREE.MeshStandardMaterial({ 
        color: 0xff66cc, // Warna pink kemerahan seperti di foto
        emissive: 0x330033,
        roughness: 0.5,
        metalness: 0.8
    });
    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // --- PARTICLE RING (Cincin Partikel) ---
    const particlesGeometry = new THREE.BufferGeometry();
    const count = 3000; // Jumlah kotak/partikel
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
        // Membuat pola melingkar (Orbit)
        const radius = 4 + Math.random() * 2;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * 0.5; // Ketebalan vertikal cincin

        positions[i * 3] = radius * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi);
        positions[i * 3 + 2] = radius * Math.sin(theta);
    }

    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Material partikel (kotak-kotak putih kecil)
    const particlesMaterial = new THREE.PointsMaterial({
        size: 0.05,
        color: 0xffffff,
        transparent: true,
        opacity: 0.8
    });

    const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particleSystem);

    // --- CAHAYA ---
    const pointLight = new THREE.PointLight(0xffffff, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);
    scene.add(new THREE.AmbientLight(0x404040)); // Cahaya redup sekitar

    camera.position.z = 10;

    // --- ANIMASI ---
    function animate() {
        requestAnimationFrame(animate);

        // Putar Planet
        planet.rotation.y += 0.005;

        // Putar Sistem Partikel (Cincin)
        particleSystem.rotation.y += 0.002;
        particleSystem.rotation.x += 0.001;

        renderer.render(scene, camera);
    }

    // Handle Resize Window
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Galaxy Love 3D 💖</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
  </style>
</head>
<body>

<!-- THREE JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(3,2,6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// CONTROL (BIAR BISA DIPUTER)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// LIGHTING (INI YANG BIKIN GA GEPENG)
const light1 = new THREE.DirectionalLight(0xffffff, 1);
light1.position.set(5,5,5);
scene.add(light1);

const light2 = new THREE.AmbientLight(0x404040);
scene.add(light2);

// PLANET (UDAH 3D BENER)
const textureLoader = new THREE.TextureLoader();

const planet = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({
    map: textureLoader.load("https://threejsfundamentals.org/threejs/resources/images/earth.jpg"),
    emissive: 0xff0066,
    emissiveIntensity: 0.3,
    roughness: 0.5
  })
);

scene.add(planet);

// RING
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(2, 0.05, 16, 100),
  new THREE.MeshBasicMaterial({ color: 0xff99cc })
);
scene.add(ring);

// FOTO ORBIT
const photos = [
  "https://i.imgur.com/TAidPJV.jpg",
  "https://i.imgur.com/TAidPJV.jpg",
  "https://i.imgur.com/TAidPJV.jpg",
  "https://i.imgur.com/TAidPJV.jpg"
];

const group = new THREE.Group();

photos.forEach((src, i) => {
  const tex = textureLoader.load(src);

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
  );

  const angle = (i / photos.length) * Math.PI * 2;
  mesh.position.set(Math.cos(angle)*3, 0, Math.sin(angle)*3);

  group.add(mesh);
});

scene.add(group);

// ANIMASI
function animate() {
  requestAnimationFrame(animate);

  planet.rotation.y += 0.01;
  ring.rotation.x += 0.01;
  group.rotation.y += 0.01;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Galaxy Love 💖</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1a001f, #000);
      touch-action: none;
    }

    #scene {
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
    }

    #universe {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }

    .planet {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      margin: -100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4d6d, #ff0066);
      box-shadow: 0 0 80px #ff4d6d;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 350px;
      height: 350px;
      margin: -175px;
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }

    .ring span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 150px;
      color: #ff99cc;
      font-size: 14px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      margin: -250px;
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    .orbit img {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 15px;
      box-shadow: 0 0 20px pink;
    }

  </style>
</head>

<body>

<div id="scene">
  <div id="universe">

    <div class="planet"></div>

    <div class="ring" id="ring"></div>

    <div class="orbit" id="orbit"></div>

  </div>
</div>

<script>
  // TEXT RING
  const text = " I LOVE YOU ❤️ ";
  const ring = document.getElementById("ring");

  for (let i = 0; i < text.length * 6; i++) {
    const span = document.createElement("span");
    span.innerText = text[i % text.length];
    span.style.transform = `rotate(${i * 10}deg)`;
    ring.appendChild(span);
  }

  // FOTO ORBIT (SUDAH DIMASUKIN)
  const photos = [
    "https://i.imgur.com/TAidPJV.jpg",
    "https://i.imgur.com/TAidPJV.jpg",
    "https://i.imgur.com/TAidPJV.jpg",
    "https://i.imgur.com/TAidPJV.jpg"
  ];

  const orbit = document.getElementById("orbit");

  photos.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;

    const angle = (i / photos.length) * 360;
    img.style.transform = `rotate(${angle}deg) translate(250px) rotate(-${angle}deg)`;

    orbit.appendChild(img);
  });

  // DRAG GESER
  let x = 0, y = 0;
  let dragging = false;

  document.addEventListener("touchstart", () => dragging = true);
  document.addEventListener("touchend", () => dragging = false);

  document.addEventListener("touchmove", (e) => {
    if (!dragging) return;

    x += e.touches[0].movementX || 1;
    y += e.touches[0].movementY || 1;

    document.getElementById("universe").style.transform =
      `rotateX(${y}deg) rotateY(${x}deg)`;
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE YOU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Planet Container */
        .container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        /* Planet */
        .planet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffb6c1, #ff69b4, #c71585);
            box-shadow: 
                inset -10px -10px 20px rgba(0,0,0,0.3),
                0 0 50px #ff69b4,
                0 0 100px #ff1493;
            z-index: 2;
        }

        /* Text Ring */
        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: rotate 20s linear infinite;
        }

        .ring-text {
            fill: #ffffff;
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Particle Effect */
        .particles {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: 
                radial-gradient(circle, transparent 40%, rgba(255,255,255,0.1) 41%, transparent 42%),
                radial-gradient(circle, transparent 40%, rgba(255,255,255,0.1) 41%, transparent 42%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="particles"></div>
        <div class="planet"></div>
        
        <svg class="ring" viewBox="0 0 400 400">
            <defs>
                <path id="circlePath" d="M 200,50 a 150,150 0 0 1 0,300 a 150,150 0 0 1 0,-300" />
            </defs>
            <text>
                <textPath href="#circlePath" class="ring-text" startOffset="50%" text-anchor="middle">
                    I LOVE YOU • I LOVE YOU • I LOVE YOU • I LOVE YOU •
                </textPath>
            </text>
        </svg>
    </div>

    <script>
        // Create stars background
        const starsContainer = document.getElementById('stars');
        const starCount = 200;

        for(let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>

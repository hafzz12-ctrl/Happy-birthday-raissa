<!DOCTYPE html>
<html>
<head>
  <title>Galaxy Love 3D 💖</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // LIGHT
  const light = new THREE.PointLight(0xff4d6d, 2, 100);
  light.position.set(0, 0, 5);
  scene.add(light);

  // PLANET
  const geometry = new THREE.SphereGeometry(1, 64, 64);
  const material = new THREE.MeshStandardMaterial({
    color: 0xff4d6d,
    emissive: 0xff0066,
    emissiveIntensity: 0.6
  });

  const planet = new THREE.Mesh(geometry, material);
  scene.add(planet);

  // RING TEXT (simple fake ring)
  const ringGeometry = new THREE.TorusGeometry(2, 0.05, 16, 100);
  const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xff99cc });
  const ring = new THREE.Mesh(ringGeometry, ringMaterial);
  scene.add(ring);

  // FOTO ORBIT
  const textureLoader = new THREE.TextureLoader();

  const photos = [
    "https://i.imgur.com/TAidPJV.jpg",
    "https://i.imgur.com/TAidPJV.jpg",
    "https://i.imgur.com/TAidPJV.jpg"
  ];

  const photoMeshes = [];

  photos.forEach((src, i) => {
    const tex = textureLoader.load(src);
    const mat = new THREE.MeshBasicMaterial({ map: tex });
    const geo = new THREE.PlaneGeometry(1, 1);
    const mesh = new THREE.Mesh(geo, mat);

    const angle = (i / photos.length) * Math.PI * 2;
    mesh.position.set(Math.cos(angle) * 3, 0, Math.sin(angle) * 3);

    scene.add(mesh);
    photoMeshes.push(mesh);
  });

  // DRAG CONTROL
  let isDragging = false;
  let prevX = 0;

  window.addEventListener("touchstart", (e) => {
    isDragging = true;
    prevX = e.touches[0].clientX;
  });

  window.addEventListener("touchend", () => {
    isDragging = false;
  });

  window.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    let delta = e.touches[0].clientX - prevX;
    prevX = e.touches[0].clientX;

    planet.rotation.y += delta * 0.01;
    ring.rotation.y += delta * 0.01;
    photoMeshes.forEach(p => p.rotation.y += delta * 0.01);
  });

  // ANIMATION
  function animate() {
    requestAnimationFrame(animate);

    ring.rotation.x += 0.01;

    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
